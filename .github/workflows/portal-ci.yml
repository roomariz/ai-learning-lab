name: Portal CI

on:
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
