name: Python Apps CI

on:
  pull_request:
    paths:
      - "projects/03-query-flow/**"
      - "projects/04-ragas-evaluation/**"
      - "projects/08-ai-toolkit/**"
      - ".github/workflows/python-apps-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/03-query-flow/**"
      - "projects/04-ragas-evaluation/**"
      - "projects/08-ai-toolkit/**"
      - ".github/workflows/python-apps-ci.yml"

jobs:
  query-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/03-query-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[retrieval,yaml,benchmark]"
          pip install streamlit
      - name: Import check
        run: python -c "from query_flow import pipelines; pipelines.statistical()"

  rag-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-ragas-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit plotly
      - name: Import dashboard dependencies
        run: python -c "import pandas; import streamlit; import src.config"

  ai-toolkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/08-ai-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/test_tools.py -q
